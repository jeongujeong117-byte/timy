  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;schedule-v2&#x27;);
  if (!root) return;
  const days = [[&#x27;월&#x27;,&#x27;8&#x27;],[&#x27;화&#x27;,&#x27;9&#x27;],[&#x27;수&#x27;,&#x27;10&#x27;],[&#x27;목&#x27;,&#x27;11&#x27;],[&#x27;금&#x27;,&#x27;12&#x27;]];
  const heat = [
    [0,1,2,1,0],[1,2,2,3,1],[2,3,2,2,1],[2,2,3,4,2],
    [1,3,3,2,2],[2,2,3,3,1],[2,3,2,3,2],[3,3,4,3,2],
    [2,4,3,4,2],[3,3,4,3,2],[2,3,3,2,1],[1,2,2,1,0]
  ];
  const counts = [0,2,3,5,6];

  function buildSchedule(el) {
    const kind = el.dataset.kind;
    const isSelect = kind === &#x27;select&#x27;;
    const isBackdrop = kind === &#x27;heat-backdrop&#x27;;
    const head = document.createElement(&#x27;div&#x27;);
    head.className = &#x27;sv2-grid-head&#x27;;
    head.innerHTML = &#x27;&lt;span&gt;&lt;/span&gt;&#x27; + days.map(d =&gt; `&lt;span class=&quot;sv2-day&quot;&gt;${d[0]}&lt;b&gt;${d[1]}&lt;/b&gt;&lt;/span&gt;`).join(&#x27;&#x27;);
    const body = document.createElement(&#x27;div&#x27;);
    body.className = &#x27;sv2-grid-body&#x27;;
    for (let r=0;r&lt;12;r++) {
      const row = document.createElement(&#x27;div&#x27;);
      row.className = &#x27;sv2-grid-row&#x27;;
      row.innerHTML = `&lt;span class=&quot;sv2-hour&quot;&gt;${r+10}&lt;/span&gt;`;
      for (let c=0;c&lt;5;c++) {
        const slot = document.createElement(&#x27;button&#x27;);
        slot.type = &#x27;button&#x27;;
        slot.className = &#x27;sv2-slot&#x27;;
        slot.dataset.row = r; slot.dataset.col = c;
        if (isSelect) {
          slot.classList.add(&#x27;is-available&#x27;);
          slot.setAttribute(&#x27;aria-label&#x27;, `${days[c][0]}요일 ${r+10}시 가능`);
          slot.setAttribute(&#x27;aria-pressed&#x27;,&#x27;true&#x27;);
        } else {
          const level = heat[r][c];
          slot.classList.add(&#x27;sv2-heat&#x27;);
          slot.dataset.level = level;
          slot.textContent = counts[level];
          slot.setAttribute(&#x27;aria-label&#x27;, `${days[c][0]}요일 ${r+10}시 ${counts[level]}명 가능`);
          if (!isBackdrop) slot.addEventListener(&#x27;click&#x27;, () =&gt; pickHeat(el,slot));
        }
        row.appendChild(slot);
      }
      body.appendChild(row);
    }
    el.append(head,body);
    if (isSelect) wireDrag(el);
  }

  function pickHeat(el, slot) {
    el.querySelectorAll(&#x27;.is-picked&#x27;).forEach(s =&gt; s.classList.remove(&#x27;is-picked&#x27;));
    slot.classList.add(&#x27;is-picked&#x27;);
    const r=+slot.dataset.row, c=+slot.dataset.col;
    const parent = el.closest(&#x27;.sv2-phone&#x27;);
    const names = parent.querySelector(&#x27;.sv2-names&#x27;);
    if (names) {
      const n = counts[heat[r][c]];
      const roster = [&#x27;참여1&#x27;,&#x27;민지&#x27;,&#x27;현우&#x27;,&#x27;지수&#x27;,&#x27;수빈&#x27;,&#x27;도윤&#x27;].slice(0,n).join(&#x27;, &#x27;);
      names.textContent = `${days[c][1]}일 ${days[c][0]} ${r+10}:00 · ${roster || &#x27;가능한 참여자 없음&#x27;}`;
    }
  }

  function wireDrag(el) {
    let dragging=false, targetState=false, touched=new Set(), anchor=null, anchorState=false, startSlot=null;
    const hint = el.parentElement.querySelector(&#x27;.sv2-gesture-hint&#x27;);
    const defaultHint = &#x27;드래그하거나 시작·끝 칸을 차례로 선택&#x27;;
    const setState = (slot,state,mark=false) =&gt; {
      slot.classList.toggle(&#x27;is-available&#x27;,state);
      if (mark) slot.classList.add(&#x27;is-dragging&#x27;);
      slot.setAttribute(&#x27;aria-pressed&#x27;,String(state));
      slot.setAttribute(&#x27;aria-label&#x27;,slot.getAttribute(&#x27;aria-label&#x27;).replace(/가능$|불가능$/,state?&#x27;가능&#x27;:&#x27;불가능&#x27;));
    };
    const paint = slot =&gt; {
      const key = `${slot.dataset.row}-${slot.dataset.col}`;
      if (touched.has(key)) return;
      touched.add(key);
      setState(slot,targetState,true);
    };
    const clearAnchor = () =&gt; {
      if (anchor) anchor.classList.remove(&#x27;is-anchor&#x27;);
      anchor=null;
    };
    el.addEventListener(&#x27;sv2-clear-anchor&#x27;,()=&gt;{
      clearAnchor();
      if (hint) hint.textContent=defaultHint;
    });
    const finishTap = slot =&gt; {
      if (!anchor) {
        anchor=slot; anchorState=targetState; anchor.classList.add(&#x27;is-anchor&#x27;);
        if (hint) hint.textContent=&#x27;시작 칸 선택됨 · 끝 칸을 선택하세요&#x27;;
        return;
      }
      if (anchor===slot) {
        clearAnchor();
        if (hint) hint.textContent=defaultHint;
        return;
      }
      const r1=+anchor.dataset.row, c1=+anchor.dataset.col, r2=+slot.dataset.row, c2=+slot.dataset.col;
      el.querySelectorAll(&#x27;.sv2-slot&#x27;).forEach(cell =&gt; {
        const r=+cell.dataset.row, c=+cell.dataset.col;
        if (r&gt;=Math.min(r1,r2) &amp;&amp; r&lt;=Math.max(r1,r2) &amp;&amp; c&gt;=Math.min(c1,c2) &amp;&amp; c&lt;=Math.max(c1,c2)) setState(cell,anchorState);
      });
      clearAnchor();
      if (hint) hint.textContent=defaultHint;
    };
    el.addEventListener(&#x27;pointerdown&#x27;, e =&gt; {
      const slot=e.target.closest(&#x27;.sv2-slot&#x27;); if(!slot)return;
      e.preventDefault(); dragging=true; touched.clear(); startSlot=slot; targetState=!slot.classList.contains(&#x27;is-available&#x27;);
      el.setPointerCapture?.(e.pointerId); paint(slot);
    });
    el.addEventListener(&#x27;pointermove&#x27;, e =&gt; {
      if(!dragging)return;
      const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest(&#x27;.sv2-slot&#x27;);
      if(hit &amp;&amp; el.contains(hit)) paint(hit);
    });
    const finish = cancelled =&gt; {
      if(!dragging)return;
      const wasTap=touched.size===1 &amp;&amp; !cancelled;
      dragging=false;
      el.querySelectorAll(&#x27;.is-dragging&#x27;).forEach(s=&gt;s.classList.remove(&#x27;is-dragging&#x27;));
      if (wasTap &amp;&amp; startSlot) finishTap(startSlot);
      else {
        clearAnchor();
        if (hint) hint.textContent=defaultHint;
      }
      startSlot=null; touched.clear();
    };
    el.addEventListener(&#x27;pointerup&#x27;,()=&gt;finish(false));
    el.addEventListener(&#x27;pointercancel&#x27;,()=&gt;finish(true));
    el.addEventListener(&#x27;click&#x27;,e=&gt;{
      e.preventDefault();
      if(e.detail!==0)return;
      const slot=e.target.closest(&#x27;.sv2-slot&#x27;); if(!slot)return;
      targetState=!slot.classList.contains(&#x27;is-available&#x27;);
      setState(slot,targetState); finishTap(slot);
    });
  }

  root.querySelectorAll(&#x27;.sv2-schedule&#x27;).forEach(buildSchedule);
  root.querySelectorAll(&#x27;.sv2-switcher button&#x27;).forEach(tab =&gt; tab.addEventListener(&#x27;click&#x27;, () =&gt; {
    root.querySelectorAll(&#x27;.sv2-switcher button&#x27;).forEach(t=&gt;t.setAttribute(&#x27;aria-selected&#x27;,&#x27;false&#x27;));
    root.querySelectorAll(&#x27;.sv2-phone&#x27;).forEach(p=&gt;p.classList.remove(&#x27;is-active&#x27;));
    tab.setAttribute(&#x27;aria-selected&#x27;,&#x27;true&#x27;);
    root.querySelector(`[data-panel=&quot;${tab.dataset.screen}&quot;]`).classList.add(&#x27;is-active&#x27;);
  }));

  const mode = root.querySelector(&#x27;.sv2-mode-toggle&#x27;);
  const strip = root.querySelector(&#x27;.sv2-reset-strip&#x27;);
  let snapshot=[];
  mode.addEventListener(&#x27;click&#x27;, () =&gt; {
    const grid=root.querySelector(&#x27;[data-kind=&quot;select&quot;]&#x27;);
    grid.dispatchEvent(new Event(&#x27;sv2-clear-anchor&#x27;));
    snapshot=[...grid.querySelectorAll(&#x27;.sv2-slot&#x27;)].map(s=&gt;s.classList.contains(&#x27;is-available&#x27;));
    const next=mode.getAttribute(&#x27;aria-pressed&#x27;)!==&#x27;true&#x27;; mode.setAttribute(&#x27;aria-pressed&#x27;,String(next));
    grid.querySelectorAll(&#x27;.sv2-slot&#x27;).forEach(s=&gt;{ s.classList.remove(&#x27;is-anchor&#x27;); s.classList.toggle(&#x27;is-available&#x27;,!next); s.setAttribute(&#x27;aria-pressed&#x27;,String(!next)); });
    root.querySelector(&#x27;.sv2-gesture-hint&#x27;).textContent=&#x27;드래그하거나 시작·끝 칸을 차례로 선택&#x27;;
    strip.hidden=false;
  });
  strip.querySelector(&#x27;button&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{
    root.querySelector(&#x27;[data-kind=&quot;select&quot;]&#x27;).dispatchEvent(new Event(&#x27;sv2-clear-anchor&#x27;));
    root.querySelectorAll(&#x27;[data-kind=&quot;select&quot;] .sv2-slot&#x27;).forEach((s,i)=&gt;{ s.classList.remove(&#x27;is-anchor&#x27;); s.classList.toggle(&#x27;is-available&#x27;,snapshot[i]); s.setAttribute(&#x27;aria-pressed&#x27;,String(snapshot[i])); });
    root.querySelector(&#x27;.sv2-gesture-hint&#x27;).textContent=&#x27;드래그하거나 시작·끝 칸을 차례로 선택&#x27;;
    mode.setAttribute(&#x27;aria-pressed&#x27;,String(mode.getAttribute(&#x27;aria-pressed&#x27;)!==&#x27;true&#x27;)); strip.hidden=true;
  });

  root.querySelectorAll(&#x27;.sv2-calendar button:not(.sv2-empty)&#x27;).forEach(day=&gt;day.addEventListener(&#x27;click&#x27;,()=&gt;{
    if(day.classList.contains(&#x27;is-date-selected&#x27;)) day.classList.remove(&#x27;is-date-selected&#x27;);
    else if(root.querySelectorAll(&#x27;.sv2-calendar .is-date-selected&#x27;).length&lt;5) day.classList.add(&#x27;is-date-selected&#x27;);
  }));

  const nextTime = root.querySelector(&#x27;.sv2-next-time&#x27;);
  nextTime.addEventListener(&#x27;click&#x27;,()=&gt;{
    const time=root.querySelector(&#x27;.sv2-dialog-time&#x27;);
    const second=time.textContent.includes(&#x27;12일&#x27;);
    time.innerHTML=second?&#x27;9월 11일 목요일&lt;br&gt;18:00–20:00&#x27;:&#x27;9월 12일 금요일&lt;br&gt;19:00–21:00&#x27;;
    root.querySelector(&#x27;.sv2-dialog p&#x27;).textContent=second?&#x27;6명 중 3명 가능 · 3명 불가&#x27;:&#x27;6명 중 4명 가능 · 2명 불가&#x27;;
  });
})();

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
